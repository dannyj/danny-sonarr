name: Private Upstream Sync

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      upstream_branch:
        description: Public Sonarr branch to merge from
        required: false
        default: v5-main
        type: string
      target_branch:
        description: Private branch to open the sync PR against
        required: false
        default: private-main
        type: string

permissions:
  contents: write
  pull-requests: write

env:
  DEFAULT_UPSTREAM_BRANCH: v5-main
  DEFAULT_TARGET_BRANCH: private-main
  UPSTREAM_REPOSITORY: Sonarr/Sonarr

jobs:
  sync:
    if: ${{ github.repository != 'Sonarr/Sonarr' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve branch inputs
        shell: bash
        run: |
          upstream_branch="${{ inputs.upstream_branch }}"
          target_branch="${{ inputs.target_branch }}"

          if [ -z "${upstream_branch}" ]; then
            upstream_branch="${DEFAULT_UPSTREAM_BRANCH}"
          fi

          if [ -z "${target_branch}" ]; then
            target_branch="${DEFAULT_TARGET_BRANCH}"
          fi

          echo "UPSTREAM_BRANCH=${upstream_branch}" >> "$GITHUB_ENV"
          echo "TARGET_BRANCH=${target_branch}" >> "$GITHUB_ENV"
          echo "SYNC_BRANCH=automation/upstream-sync-${upstream_branch//\//-}" >> "$GITHUB_ENV"

      - name: Configure git
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config rerere.enabled true

      - name: Fetch remotes
        shell: bash
        run: |
          if git remote get-url upstream >/dev/null 2>&1; then
            git remote set-url upstream "https://github.com/${UPSTREAM_REPOSITORY}.git"
          else
            git remote add upstream "https://github.com/${UPSTREAM_REPOSITORY}.git"
          fi

          git fetch --no-tags origin "${TARGET_BRANCH}"
          git fetch --no-tags upstream "${UPSTREAM_BRANCH}"

      - name: Merge upstream into sync branch
        id: merge
        shell: bash
        run: |
          git checkout -B "${SYNC_BRANCH}" "origin/${TARGET_BRANCH}"

          if ! git merge --no-ff --no-edit "upstream/${UPSTREAM_BRANCH}"; then
            echo "Upstream merge produced conflicts." >> "$GITHUB_STEP_SUMMARY"
            echo "Resolve them locally and push the result to ${TARGET_BRANCH}." >> "$GITHUB_STEP_SUMMARY"
            git merge --abort
            exit 1
          fi

          if git diff --quiet "origin/${TARGET_BRANCH}" HEAD; then
            echo "noop=true" >> "$GITHUB_OUTPUT"
            echo "Target branch is already up to date with upstream/${UPSTREAM_BRANCH}." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "noop=false" >> "$GITHUB_OUTPUT"

      - name: Push sync branch
        if: ${{ steps.merge.outputs.noop != 'true' }}
        shell: bash
        run: |
          git push --force-with-lease origin "${SYNC_BRANCH}"

      - name: Create pull request
        if: ${{ steps.merge.outputs.noop != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          pr_url=$(gh pr list \
            --base "${TARGET_BRANCH}" \
            --head "${SYNC_BRANCH}" \
            --state open \
            --json url \
            --jq '.[0].url')

          title="chore: merge upstream/${UPSTREAM_BRANCH} into ${TARGET_BRANCH}"
          body="Automated upstream sync from \`${UPSTREAM_REPOSITORY}:${UPSTREAM_BRANCH}\` into \`${TARGET_BRANCH}\`."

          if [ -n "${pr_url}" ] && [ "${pr_url}" != "null" ]; then
            gh pr edit "${pr_url}" --title "${title}" --body "${body}"
          else
            gh pr create \
              --base "${TARGET_BRANCH}" \
              --head "${SYNC_BRANCH}" \
              --title "${title}" \
              --body "${body}"
          fi
