name: Private Upstream Sync

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      upstream_branch:
        description: Public Sonarr branch to merge from
        required: false
        default: v5-develop
        type: string
      target_branch:
        description: Private branch to open the sync PR against
        required: false
        default: production
        type: string

permissions:
  contents: write
  pull-requests: write

env:
  DEFAULT_UPSTREAM_BRANCH: v5-develop
  DEFAULT_TARGET_BRANCH: production
  UPSTREAM_REPOSITORY: Sonarr/Sonarr

jobs:
  sync:
    if: ${{ github.repository != 'Sonarr/Sonarr' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve branch inputs
        shell: bash
        run: |
          upstream_branch="${{ inputs.upstream_branch }}"
          target_branch="${{ inputs.target_branch }}"

          if [ -z "${upstream_branch}" ]; then
            upstream_branch="${DEFAULT_UPSTREAM_BRANCH}"
          fi

          if [ -z "${target_branch}" ]; then
            target_branch="${DEFAULT_TARGET_BRANCH}"
          fi

          echo "UPSTREAM_BRANCH=${upstream_branch}" >> "$GITHUB_ENV"
          echo "TARGET_BRANCH=${target_branch}" >> "$GITHUB_ENV"
          echo "SYNC_BRANCH=automation/upstream-sync-${upstream_branch//\//-}" >> "$GITHUB_ENV"

      - name: Configure git
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config rerere.enabled true

      - name: Fetch remotes
        shell: bash
        run: |
          if git remote get-url upstream >/dev/null 2>&1; then
            git remote set-url upstream "https://github.com/${UPSTREAM_REPOSITORY}.git"
          else
            git remote add upstream "https://github.com/${UPSTREAM_REPOSITORY}.git"
          fi

          git fetch --no-tags origin "${TARGET_BRANCH}"
          git fetch --no-tags upstream "${UPSTREAM_BRANCH}"

      - name: Merge upstream into sync branch
        id: merge
        shell: bash
        run: |
          git checkout -B "${SYNC_BRANCH}" "origin/${TARGET_BRANCH}"

          if ! git merge --no-ff --no-edit "upstream/${UPSTREAM_BRANCH}"; then
            echo "Upstream merge produced conflicts." >> "$GITHUB_STEP_SUMMARY"
            echo "Resolve them locally and push the result to ${TARGET_BRANCH}." >> "$GITHUB_STEP_SUMMARY"
            git merge --abort
            exit 1
          fi

          if git diff --quiet "origin/${TARGET_BRANCH}" HEAD; then
            echo "noop=true" >> "$GITHUB_OUTPUT"
            echo "Target branch is already up to date with upstream/${UPSTREAM_BRANCH}." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "noop=false" >> "$GITHUB_OUTPUT"

      - name: Push sync branch
        if: ${{ steps.merge.outputs.noop != 'true' }}
        shell: bash
        run: |
          git push --force-with-lease origin "${SYNC_BRANCH}"

      - name: Create pull request
        if: ${{ steps.merge.outputs.noop != 'true' }}
        env:
          DEFAULT_GH_TOKEN: ${{ github.token }}
          PR_CREATION_TOKEN: ${{ secrets.PR_CREATION_TOKEN }}
        shell: bash
        run: |
          export GH_TOKEN="${DEFAULT_GH_TOKEN}"

          if [ -z "${PR_CREATION_TOKEN}" ]; then
            echo "PR_CREATION_TOKEN is not set; falling back to github.token." >> "$GITHUB_STEP_SUMMARY"
          fi

          pr_number=$(gh api \
            "repos/${GITHUB_REPOSITORY}/pulls?state=open&base=${TARGET_BRANCH}&head=${GITHUB_REPOSITORY_OWNER}:${SYNC_BRANCH}" \
            --jq '.[0].number')

          title="chore: merge upstream/${UPSTREAM_BRANCH} into ${TARGET_BRANCH}"
          body="Automated upstream sync from \`${UPSTREAM_REPOSITORY}:${UPSTREAM_BRANCH}\` into \`${TARGET_BRANCH}\`."

          if [ -n "${pr_number}" ] && [ "${pr_number}" != "null" ]; then
            gh api \
              --method PATCH \
              "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}" \
              -f title="${title}" \
              -f body="${body}" \
              >/dev/null
          else
            if [ -n "${PR_CREATION_TOKEN}" ]; then
              export GH_TOKEN="${PR_CREATION_TOKEN}"
            fi

            if gh pr create \
              --base "${TARGET_BRANCH}" \
              --head "${SYNC_BRANCH}" \
              --title "${title}" \
              --body "${body}"; then
              :
            else
              export GH_TOKEN="${DEFAULT_GH_TOKEN}"
              pr_number=$(gh api \
                "repos/${GITHUB_REPOSITORY}/pulls?state=open&base=${TARGET_BRANCH}&head=${GITHUB_REPOSITORY_OWNER}:${SYNC_BRANCH}" \
                --jq '.[0].number')

              if [ -n "${pr_number}" ] && [ "${pr_number}" != "null" ]; then
                echo "Pull request already exists; updating existing PR metadata." >> "$GITHUB_STEP_SUMMARY"
                gh api \
                  --method PATCH \
                  "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}" \
                  -f title="${title}" \
                  -f body="${body}" \
                  >/dev/null
              else
                exit 1
              fi
            fi
          fi
