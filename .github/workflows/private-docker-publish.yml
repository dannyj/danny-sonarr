name: Private Docker Publish

on:
  pull_request:
    branches:
      - private-main
  push:
    branches:
      - private-main
      - feature-*
      - feature/**
      - hotfix/**
  workflow_dispatch:
    inputs:
      push_image:
        description: Push the built image to GHCR
        required: true
        default: true
        type: boolean
      deploy_after_publish:
        description: Deploy on the server after publishing
        required: true
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/sonarr-private

jobs:
  prepare:
    if: ${{ github.repository != 'Sonarr/Sonarr' }}
    runs-on: ubuntu-latest
    outputs:
      should_push: ${{ steps.flags.outputs.should_push }}
      should_deploy: ${{ steps.flags.outputs.should_deploy }}
    steps:
      - name: Resolve execution flags
        id: flags
        shell: bash
        run: |
          should_push=false
          should_deploy=false

          if [ "${{ github.event_name }}" = "push" ]; then
            should_push=true
            if [ "${{ github.ref_name }}" = "private-main" ] && \
               [ -n "${{ secrets.DEPLOY_HOST }}" ] && \
               [ -n "${{ secrets.DEPLOY_USER }}" ] && \
               [ -n "${{ secrets.DEPLOY_SSH_KEY }}" ] && \
               [ -n "${{ secrets.DEPLOY_PATH }}" ]; then
              should_deploy=true
            fi
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.push_image }}" = "true" ]; then
              should_push=true
            fi

            if [ "${{ inputs.deploy_after_publish }}" = "true" ] && \
               [ -n "${{ secrets.DEPLOY_HOST }}" ] && \
               [ -n "${{ secrets.DEPLOY_USER }}" ] && \
               [ -n "${{ secrets.DEPLOY_SSH_KEY }}" ] && \
               [ -n "${{ secrets.DEPLOY_PATH }}" ]; then
              should_deploy=true
            fi
          fi

          echo "should_push=${should_push}" >> "$GITHUB_OUTPUT"
          echo "should_deploy=${should_deploy}" >> "$GITHUB_OUTPUT"

  publish:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref_name == 'private-main' }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Log in to GHCR
        if: ${{ needs.prepare.outputs.should_push == 'true' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ needs.prepare.outputs.should_push == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: [prepare, publish]
    if: ${{ needs.prepare.outputs.should_deploy == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy updated image on server
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script_stop: true
          script: |
            cd "${{ secrets.DEPLOY_PATH }}"
            docker compose pull
            docker compose up -d
